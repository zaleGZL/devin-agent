name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "apps/desktop/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:independence

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64 --config.mac.notarize=false
            artifact: macos
          - os: ubuntu-22.04
            args: --linux --x64
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package unsigned verification artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --dir apps/desktop exec electron-builder ${{ matrix.args }} --publish onTagOrDraft
      - name: Smoke test packaged application
        if: runner.os != 'Linux'
        run: pnpm --dir apps/desktop smoke:packaged
      - name: Smoke test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --dir apps/desktop smoke:packaged
      - uses: actions/upload-artifact@v7
        with:
          name: devin-agent-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error
