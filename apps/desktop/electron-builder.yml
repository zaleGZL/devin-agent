appId: ai.devin-agent.desktop
productName: Devin Agent
copyright: Copyright © 2026 Devin Agent contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - src/main/weixin/LICENSE.tencent-weixin
  - build/icon.png
  - LICENSE
  - package.json
  - "!**/*.map"

# The agent runtime is launched through Electron's executable in Node mode. Keep
# its JavaScript and native dependencies on real filesystem paths.
asar: false

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: "${productName}_${version}_${arch}.${ext}"

dmg:
  sign: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}_${version}_${arch}-setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Development
  executableName: devin-agent
  syncDesktopName: true
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  artifactName: "${productName}_${version}_${arch}.${ext}"

deb:
  packageName: devin-agent

rpm:
  packageName: devin-agent

publish: null
